<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Enhancer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Pretendard:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="hero-top">
          <p class="badge">Vanilla JS · BYOK · GitHub Pages</p>
          <button id="lang-toggle-btn" type="button" class="ghost-btn lang-btn">English</button>
        </div>
        <h1 data-i18n="hero.title">프롬프트 개선기</h1>
        <p class="hero-copy" data-i18n="hero.copy">원하는 개선 방식 버튼을 고른 뒤, 제공자/모델/API 키(BYOK)를 입력하고 즉시 개선하세요.</p>
      </header>

      <section class="card" aria-labelledby="config-title">
        <div class="section-head">
          <h2 id="config-title" data-i18n="config.title">API 설정</h2>
          <button id="save-cookie-btn" type="button" class="ghost-btn" data-i18n="config.saveCookie">쿠키 저장</button>
        </div>

        <div class="preset-block">
          <p class="preset-title" data-i18n="config.providerPreset">제공자 프리셋</p>
          <div id="provider-presets" class="chip-row"></div>
        </div>

        <div class="grid two-col">
          <label>
            <span data-i18n="config.provider">제공자</span>
            <input id="provider-input" type="text" placeholder="예: openai" data-i18n-placeholder="config.providerPlaceholder" autocomplete="off" />
          </label>

          <label>
            <span data-i18n="config.model">모델</span>
            <input id="model-input" type="text" placeholder="예: gpt-4o-mini" data-i18n-placeholder="config.modelPlaceholder" autocomplete="off" />
          </label>
        </div>

        <div class="preset-block">
          <p class="preset-title" data-i18n="config.modelPreset">모델 프리셋</p>
          <div id="model-presets" class="chip-row"></div>
        </div>

        <div class="grid two-col">
          <label>
            <span data-i18n="config.apiKey">API 키 (BYOK)</span>
            <input id="api-key-input" type="password" placeholder="sk-..." data-i18n-placeholder="config.apiKeyPlaceholder" autocomplete="off" />
          </label>

          <label>
            <span data-i18n="config.endpoint">Endpoint (선택)</span>
            <input id="endpoint-input" type="text" placeholder="비우면 프리셋 기본값 사용" data-i18n-placeholder="config.endpointPlaceholder" autocomplete="off" />
          </label>
        </div>

        <div class="grid two-col">
          <label>
            <span data-i18n="config.maxTokens">Max Tokens (선택)</span>
            <input id="max-tokens-input" type="number" min="1" step="1" placeholder="예: 512" data-i18n-placeholder="config.maxTokensPlaceholder" autocomplete="off" />
          </label>
        </div>

        <p class="hint" data-i18n="config.hint">브라우저 쿠키에만 저장됩니다. 공용 PC에서는 저장을 권장하지 않습니다.</p>
      </section>

      <section class="card" aria-labelledby="preset-title">
        <h2 id="preset-title" data-i18n="preset.title">개선 프롬프트 선택</h2>
        <div id="prompt-options" class="radio-list"></div>
      </section>

      <section class="card" aria-labelledby="input-title">
        <h2 id="input-title" data-i18n="input.title">원본 프롬프트</h2>
        <textarea id="source-prompt" rows="8" placeholder="개선하고 싶은 프롬프트를 입력하세요..." data-i18n-placeholder="input.placeholder"></textarea>
        <div class="action-row">
          <button id="enhance-btn" type="button" class="primary-btn" data-i18n="actions.enhance">프롬프트 개선 실행</button>
          <span id="status-text" class="status"></span>
        </div>
      </section>

      <section class="card" aria-labelledby="output-title">
        <div class="section-head">
          <h2 id="output-title" data-i18n="output.title">개선 결과</h2>
          <button id="copy-btn" type="button" class="ghost-btn" data-i18n="actions.copy">복사</button>
        </div>
        <textarea id="enhanced-output" rows="10" placeholder="여기에 결과가 표시됩니다..." data-i18n-placeholder="output.placeholder" readonly></textarea>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
